<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Wander - Travel Inspiration</title>
    </head>
    <body>

        <!-- NAV-->
         <nav>
            <a href="#home">home</a> |
            <a href="#gallery">gallery</a> |
            <a href="#contact">contact</a> |
            <a href="#video">video</a>
         </nav>

         <!--HOME-->
         <section id="home">
            <h1>Wander</h1>
            <p>Discover the world with us!</p>
         </section>

        <!--GALLERY-->
        <section id="gallery">
            <h2>Gallery</h2>
            <img src="pirin.jpg" alt="Pirin Mountain">
            <img src="plovdiv.jpg" alt="Plovdiv Sunset">
            <img src="sunny beach.jpg" alt="Sunny Beach">
        </section>

        <!--VIDEO-->
        <section id="video">
            <h2>Watch: Travel Adventures</h2>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/XuXb84utv_A" frameborder="0" allowfullscreen></iframe>
        </section>

        <!--CONTACT FORM-->
        <section id="contact">
            <h2>Contact Us</h2>
            <form>
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name"><br><br>
                
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email"><br><br>
                
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" cols="40"></textarea><br><br>
                
                <input type="submit" value="Send Message">
            </form>
        </section>

        <!--FOOTER-->
        <footer>
            <p>&copy; 2026 Wander. All rights reserved.</p>
        </footer>
        
    </body>
</html>
